<body>

<div class="bar">
  <button class="brass-btn small" id="sfxBtn" aria-pressed="false" title="Toggle sound effects">SFX: ON</button>
  <button class="brass-btn small" id="musicBtn" data-music-toggle aria-pressed="false" title="Toggle jazz">MUSIC: ON</button>
</div>

<header>
  <h1>vibecode-rng</h1>
  <p class="tag">Can I vibecode it?</p>
  <div class="stripes"><i></i><i></i><i></i><i></i><i></i></div>
</header>

<main>
  <div class="scene" id="scene">
    <div class="rig" id="rig">
      <div class="stage">
        <div class="cabinet" id="cabinet">
          <div class="back3d"></div>
          <div class="side l"></div>
          <div class="side r"></div>
          <div class="top3d"></div>

          <div class="marquee">
            <div class="bulbs top" id="bulbsTop"></div>
            <b>★ VIBE-O-MATIC ★</b>
            <div class="bulbs bot" id="bulbsBot"></div>
          </div>

          <div class="window">
            <div class="glass" id="glass">
              <div class="blurwrap" id="blurwrap"><div class="drum" id="drum"></div></div>
              <div class="payline"></div>
              <div class="sheen"></div>
            </div>
            <div class="arrow l"></div><div class="arrow r"></div>
          </div>

          <div class="tray"><span>♦ PRIZE TRAY ♦</span></div>
          <div class="plate">
            <button class="brass-btn" id="pullBtn">PULL THE LEVER</button>
          </div>
        </div>

        <div class="lever" id="lever" aria-label="Slot machine lever">
          <div class="mount"></div>
          <div class="pivot" id="pivot">
            <div class="arm" id="arm" role="button" tabindex="0" aria-label="Pull the lever">
              <div class="rod"></div>
              <div class="knob attn" id="knob"></div>
            </div>
            <div class="hub"></div>
          </div>
          <div class="hint" id="hint">pull me ↓</div>
        </div>
      </div>
    </div>
  </div>

  <div class="ticket-wrap">
    <article class="ticket hidden" id="ticket" aria-live="polite">
      <div class="rainbow-bar"></div>
      <div class="top"><span id="tNo">TICKET №0001</span><span class="badge" id="tBadge">GAME</span></div>
      <h2 id="tTitle"></h2>
      <p id="tBlurb"></p>
      <div class="prompt-label">Starter prompt — paste it into your AI</div>
      <div class="prompt" id="tPrompt"></div>
      <div class="actions">
        <button class="brass-btn" id="copyBtn">COPY PROMPT</button>
        <button class="brass-btn" id="againBtn">SPIN AGAIN</button>
      </div>
    </article>
  </div>

  <section class="history">
    <h3>Past Pulls</h3>
    <ul id="history"><li class="empty">Nothing yet. Go on, pull it.</li></ul>
  </section>
</main>

<footer>est. 1971 · vibecode responsibly · space bar also pulls · tap the phonograph for music</footer>
